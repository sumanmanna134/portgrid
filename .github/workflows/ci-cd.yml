name: PortGrid Enterprise CI/CD Pipeline

on:
  push:
    branches:
      - dev
      - qa
      - main
  pull_request:
    branches:
      - dev
      - qa
      - main
  workflow_dispatch:
    inputs:
      target_env:
        description: 'Manual Deployment Environment (dev / qa / prod)'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - qa
          - prod

permissions:
  contents: write
  packages: write
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ============================================================================
  # 1. BUILD, TEST & DEPENDENCY AUDIT
  # ============================================================================
  build-and-test:
    name: Build & Code Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Project Dependencies
        run: |
          npm ci || npm install
          npm --prefix backend ci || npm --prefix backend install
          npm --prefix frontend ci || npm --prefix frontend install

      - name: Compile Backend & Frontend Distributions
        run: npm run build

      - name: Verify CLI Tarball Packaging
        run: npm pack --dry-run

      - name: Dependency Vulnerability Audit
        run: |
          echo "Running dependency security audit..."
          npm audit --audit-level=high || true

  # ============================================================================
  # 2. STATIC SECURITY & REPOSITORY VULNERABILITY SCAN
  # ============================================================================
  security-scan:
    name: Security Vulnerability Scan
    runs-on: ubuntu-latest
    needs: [build-and-test]
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Trivy
        uses: aquasecurity/setup-trivy@v2
        with:
          version: v0.28.0

      - name: Scan Filesystem & Dependencies with Trivy
        uses: aquasecurity/trivy-action@v0.28.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

  # ============================================================================
  # 3. DOCKERIZE & PUSH CONTAINER IMAGE (DEV / QA / PROD)
  # ============================================================================
  docker-delivery:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: [build-and-test, security-scan]
    if: github.event_name != 'pull_request'
    outputs:
      pkg_version: ${{ steps.version.outputs.pkg_version }}
      target_env: ${{ steps.meta.outputs.target_env }}
      primary_tag: ${{ steps.meta.outputs.primary_tag }}
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Extract Package Version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "pkg_version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Package Version: ${VERSION}"

      - name: Resolve Environment & Image Tags
        id: meta
        run: |
          BRANCH="${GITHUB_REF_NAME}"
          SHA_SHORT="${GITHUB_SHA::7}"
          VERSION="${{ steps.version.outputs.pkg_version }}"

          # Default to dev
          ENV="dev"
          TAGS="mannasuman134/postgrid:dev,mannasuman134/postgrid:dev-${SHA_SHORT}"
          PRIMARY="mannasuman134/postgrid:dev"

          if [[ "${BRANCH}" == "qa" || "${{ github.event.inputs.target_env }}" == "qa" ]]; then
            ENV="qa"
            TAGS="mannasuman134/postgrid:qa,mannasuman134/postgrid:qa-${SHA_SHORT}"
            PRIMARY="mannasuman134/postgrid:qa"
          elif [[ "${BRANCH}" == "main" || "${{ github.event.inputs.target_env }}" == "prod" ]]; then
            ENV="prod"
            TAGS="mannasuman134/postgrid:latest,mannasuman134/postgrid:prod,mannasuman134/postgrid:v${VERSION},mannasuman134/postgrid:${SHA_SHORT}"
            PRIMARY="mannasuman134/postgrid:latest"
          fi

          echo "target_env=${ENV}" >> "$GITHUB_OUTPUT"
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"
          echo "primary_tag=${PRIMARY}" >> "$GITHUB_OUTPUT"

          echo "Target Environment: ${ENV}"
          echo "Docker Image Tags:  ${TAGS}"

      - name: Setup QEMU Architecture Emulators
        uses: docker/setup-qemu-action@v3

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.title=PortGrid
            org.opencontainers.image.description=Local Developer Infrastructure Orchestrator & PaaS
            org.opencontainers.image.version=${{ steps.version.outputs.pkg_version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Scan Published Image with Trivy
        uses: aquasecurity/trivy-action@v0.28.0
        with:
          image-ref: ${{ steps.meta.outputs.primary_tag }}
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

  # ============================================================================
  # 4. PUBLISH TO NPM & CREATE GITHUB RELEASE (MAIN / PRODUCTION ONLY)
  # ============================================================================
  npm-publish-and-release:
    name: NPM Publish & GitHub Release (Prod)
    runs-on: ubuntu-latest
    needs: [docker-delivery]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime for NPM Publish
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      - name: Install Dependencies & Build
        run: |
          npm ci || npm install
          npm run build

      - name: Publish @portgrid/cli to NPM Registry
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.docker-delivery.outputs.pkg_version }}
          name: PortGrid Release v${{ needs.docker-delivery.outputs.pkg_version }}
          body: |
            ## PortGrid v${{ needs.docker-delivery.outputs.pkg_version }} Production Release

            ### Official Artifacts
            - **NPM Package:** `@portgrid/cli@${{ needs.docker-delivery.outputs.pkg_version }}`
            - **Docker Production Image:** `docker pull mannasuman134/postgrid:latest`
            - **Versioned Image:** `docker pull mannasuman134/postgrid:v${{ needs.docker-delivery.outputs.pkg_version }}`

            ### Install & Upgrade
            ```bash
            # Global CLI install
            npm install -g @portgrid/cli

            # Zero-install execution
            npx @portgrid/cli up
            ```

            ### Commit SHA
            `${{ github.sha }}`
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
